name: Build Executables

on:
  release:
    types: [created]
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "JobAutoFiller" main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobAutoFiller-Windows
          path: dist/JobAutoFiller.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/JobAutoFiller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build APP
        run: pyinstaller --onefile --windowed --name "JobAutoFiller" main.py

      - name: Zip the app
        run: |
          cd dist
          zip -r JobAutoFiller-Mac.zip JobAutoFiller.app || zip JobAutoFiller-Mac.zip JobAutoFiller

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobAutoFiller-Mac
          path: dist/JobAutoFiller-Mac.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/JobAutoFiller-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
